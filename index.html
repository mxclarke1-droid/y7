<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Santa 3D Model Test</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
        }

        #status {
            position: fixed;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 15px;
            font-family: Arial, sans-serif;
            z-index: 10;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div id="status">🎅 Loading Santa...</div>

<script type="module">

import * as THREE from
    "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js";

import { GLTFLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111111);


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.01,
    10000
);

camera.position.set(0, 2, 8);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    window.devicePixelRatio
);

document.body.appendChild(
    renderer.domElement
);


/* =========================
   LIGHTING
========================= */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        2
    );

scene.add(ambientLight);


const directionalLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

directionalLight.position.set(
    5,
    10,
    5
);

scene.add(directionalLight);


/* =========================
   RED TEST CUBE
========================= */

const cubeGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );

const cubeMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xff0000
    });

const cube =
    new THREE.Mesh(
        cubeGeometry,
        cubeMaterial
    );

cube.position.set(
    4,
    0,
    0
);

scene.add(cube);


/* =========================
   SANTA MODEL
========================= */

// YOUR ACTUAL GLB FILE
const MODEL_FILE =
    "santas_convey_petrified.glb";


/* =========================
   LOAD SANTA
========================= */

const loader =
    new GLTFLoader();

loader.load(

    MODEL_FILE,

    function(gltf) {

        console.log(
            "🎅 SANTA GLB LOADED!"
        );

        console.log(
            gltf
        );

        const santa =
            gltf.scene;


        /* ---------------------
           ADD SANTA
        --------------------- */

        scene.add(
            santa
        );


        /* ---------------------
           FIND MODEL SIZE
        --------------------- */

        const box =
            new THREE.Box3()
                .setFromObject(
                    santa
                );

        const size =
            box.getSize(
                new THREE.Vector3()
            );

        const center =
            box.getCenter(
                new THREE.Vector3()
            );


        console.log(
            "Santa size:",
            size
        );


        /* ---------------------
           CENTER MODEL
        --------------------- */

        santa.position.x -=
            center.x;

        santa.position.y -=
            center.y;

        santa.position.z -=
            center.z;


        /* ---------------------
           AUTO SCALE
        --------------------- */

        const largestDimension =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        if (
            largestDimension > 0
        ) {

            const targetSize = 4;

            const scale =
                targetSize /
                largestDimension;

            santa.scale.setScalar(
                scale
            );

            console.log(
                "Santa scale:",
                scale
            );
        }


        /* ---------------------
           STATUS
        --------------------- */

        document.getElementById(
            "status"
        ).textContent =
            "🎅 Santa loaded successfully!";


        /* ---------------------
           COUNT MESHES
        --------------------- */

        let meshCount = 0;

        santa.traverse(
            function(object) {

                if (
                    object.isMesh
                ) {

                    meshCount++;

                }

            }
        );

        console.log(
            "Santa meshes:",
            meshCount
        );

    },


    /* =========================
       LOADING PROGRESS
    ========================= */

    function(xhr) {

        if (xhr.total) {

            const percent =
                Math.round(
                    (
                        xhr.loaded /
                        xhr.total
                    ) * 100
                );

            document.getElementById(
                "status"
            ).textContent =
                "🎅 Loading Santa... " +
                percent +
                "%";

        }

    },


    /* =========================
       ERROR
    ========================= */

    function(error) {

        console.error(
            "❌ SANTA LOAD ERROR:",
            error
        );

        document.getElementById(
            "status"
        ).textContent =
            "❌ Santa could not load. Check the GLB filename.";

    }

);


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    cube.rotation.x +=
        0.01;

    cube.rotation.y +=
        0.01;


    renderer.render(
        scene,
        camera
    );

}

animate();


/* =========================
   WINDOW RESIZE
========================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
